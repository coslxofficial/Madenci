<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Büyüklü Madenci</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:none; }
  #game { position:absolute; inset:0; width:100%; height:100%; }
  #game ruffle-player, #game ruffle-embed { width:100%; height:100%; }
  .pad { pointer-events:none; position:absolute; bottom:12px; display:flex; gap:10px; z-index:10; opacity:.55; }
  #left  { left:12px; }
  #right { right:18px; flex-wrap:wrap; justify-content:flex-end; max-width:220px; }
  .btn { pointer-events:auto; width:56px; height:56px; border-radius:50%; border:2px solid #fff; background:rgba(255,255,255,.18);
    color:#fff; font:700 20px sans-serif; display:flex; align-items:center; justify-content:center; }
  .btn.on { background:rgba(255,255,255,.5); }
  .dpad { display:grid; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(2,56px); gap:6px; }
  .dpad .up { grid-column:2; grid-row:1; } .dpad .lf { grid-column:1; grid-row:2; }
  .dpad .dn { grid-column:2; grid-row:2; } .dpad .rt { grid-column:3; grid-row:2; }
</style>
</head>
<body>
<div id="game"></div>

<div class="pad" id="left">
  <div class="dpad">
    <div class="btn up" data-key="w">W</div>
    <div class="btn lf" data-key="a">A</div>
    <div class="btn dn" data-key="s">S</div>
    <div class="btn rt" data-key="d">D</div>
