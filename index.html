<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Büyüklü Madenci</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:none; }
  #game { position:absolute; inset:0; }
  #game ruffle-player, #game ruffle-embed { width:100%; height:100%; }
  .pad { pointer-events:none; position:absolute; bottom:18px; display:flex; gap:10px; z-index:10; opacity:.55; }
  #left  { left:18px; }
  #right { right:18px; flex-wrap:wrap; justify-content:flex-end; max-width:220px; }
  .btn { pointer-events:auto; width:68px; height:68px; border-radius:50%; border:2px solid #fff; background:rgba(255,255,255,.18);
    color:#fff; font:700 22px sans-serif; display:flex; align-items:center; justify-content:center; }
  .btn.on { background:rgba(255,255,255,.5); }
  .dpad { display:grid; grid-template-columns:repeat(3,68px); grid-template-rows:repeat(2,68px); gap:6px; }
  .dpad .up { grid-column:2; grid-row:1; } .dpad .lf { grid-column:1; grid-row:2; }
  .dpad .dn { grid-column:2; grid-row:2; } .dpad .rt { grid-column:3; grid-row:2; }
</style>
</head>
<body>
<div id="game"></div>

<div class="pad" id="left">
  <div class="dpad">
    <div class="btn up" data-key="w">W</div>
    <div class="btn lf" data-key="a">A</div>
    <div class="btn dn" data-key="s">S</div>
    <div class="btn rt" data-key="d">D</div>
  </div>
</div>
<div class="pad" id="right">
  <div class="btn" data-key="e">E</div>
</div>

<script src="ruffle.js"></script>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();
  player.config = { letterbox: "on", unmuteOverlay: "hidden", splashScreen: false,
                    contextMenu: "off", scale: "showAll", quality: "high" };
  document.getElementById("game").appendChild(player);
  player.load("game.swf");

  const codes = { w:87, a:65, s:83, d:68, e:69 };
  const codeName = { w:"KeyW", a:"KeyA", s:"KeyS", d:"KeyD", e:"KeyE" };

  function send(type, key) {
    const e = new KeyboardEvent(type, { key, code: codeName[key] || key,
      keyCode: codes[key], which: codes[key], bubbles:true, cancelable:true });
    // keyCode/which are read-only in some engines; force them
    Object.defineProperty(e, "keyCode", { get:()=>codes[key] });
    Object.defineProperty(e, "which",   { get:()=>codes[key] });
    player.dispatchEvent(e);
  }

  document.querySelectorAll(".btn").forEach(b => {
    const key = b.dataset.key;
    const down = ev => { ev.preventDefault(); b.classList.add("on"); send("keydown", key); };
    const up   = ev => { ev.preventDefault(); b.classList.remove("on"); send("keyup", key); };
    b.addEventListener("touchstart", down, { passive:false });
    b.addEventListener("touchend", up, { passive:false });
    b.addEventListener("touchcancel", up, { passive:false });
  });
</script>
</body>
</html>
